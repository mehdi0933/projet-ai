<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Inscription - IA</title>
  <style>
    body { margin:0; font-family:"Segoe UI", sans-serif; background:linear-gradient(135deg,#667eea,#764ba2); height:100vh; display:flex; justify-content:center; align-items:center; }
    .card { width:400px; background:white; padding:40px; border-radius:15px; box-shadow:0 15px 35px rgba(0,0,0,0.2); }
    h2 { margin-top:0; color:#333; text-align:center; }
    input { width:100%; padding:12px; margin:10px 0; border-radius:8px; border:1px solid #ddd; box-sizing:border-box; }
    button { width:100%; padding:14px; border:none; border-radius:8px; background:#667eea; color:white; font-weight:bold; cursor:pointer; margin-top:10px; transition:0.3s; }
    button:hover { background:#5a6fd1; }
    .secondary { background:#f8f9fa; color:#667eea; border:1px solid #667eea; }
    .secondary:hover { background:#e9ecef; }
    #msgSucces, #msgErr { margin-top:15px; padding:10px; border-radius:5px; display:none; text-align:center; font-size:14px; }
    #msgSucces { background:#d4edda; color:#155724; }
    #msgErr { background:#f8d7da; color:#721c24; }
  </style>
</head>
<body>

<div class="card">
  <h2>Créer un compte</h2>
  <input id="mail" type="email" placeholder="Adresse e-mail">
  <input id="password" type="password" placeholder="Mot de passe">
  <button onclick="register()">S'inscrire</button>
  <button class="secondary" onclick="window.location='connexion.html'">Se connecter</button>
  <div id="msgSucces"></div>
  <div id="msgErr"></div>
</div>

<script>
  const API = "http://localhost:8080/ia";

  function register(){
      const mail = document.getElementById("mail").value.trim();
      const pass = document.getElementById("password").value.trim();
      if(!mail || !pass){ showErr("Champs manquants."); return; }

      fetch(API + "/user/post", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify([{ mail, password: pass, roles: ["USER"] }])
      })
      .then(async r => {
          if(!r.ok) throw new Error("Erreur inscription");
          showSucces("Compte créé ! Redirection...");
          setTimeout(() => window.location = 'connexion.html', 2000);
      })
      .catch(err => showErr("Erreur serveur ou mail déjà utilisé."));
  }
  function showSucces(t){ const s=document.getElementById("msgSucces"); s.style.display="block"; s.innerText=t; }
  function showErr(t){ const e=document.getElementById("msgErr"); e.style.display="block"; e.innerText=t; }
</script>
</body>
</html>
