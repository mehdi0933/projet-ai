<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Connexion - IA</title>
  <style>
    body { margin:0; font-family:"Segoe UI", sans-serif; background:linear-gradient(135deg,#4facfe,#00f2fe); height:100vh; display:flex; justify-content:center; align-items:center; }
    .card { width:400px; background:white; padding:40px; border-radius:15px; box-shadow:0 15px 35px rgba(0,0,0,0.1); }
    h2 { text-align:center; color:#222; margin-top:0; }
    input { width:100%; padding:12px; margin:10px 0; border-radius:8px; border:1px solid #ccc; box-sizing:border-box; }
    button { width:100%; padding:14px; border:none; border-radius:8px; background:#0074ff; color:white; font-weight:bold; cursor:pointer; width:100%; }
    .link { text-align:center; margin-top:15px; font-size:14px; }
    .link a { color:#0074ff; text-decoration:none; font-weight:bold; }
  </style>
</head>
<body>
<div class="card">
  <h2>Connexion</h2>
  <input id="mail" type="email" placeholder="Email (ex: monmail@yopmail.com)">
  <input id="password" type="password" placeholder="Mot de passe">
  <button onclick="login()">Se connecter</button>
  <div class="link"><a href="inscription.html">Pas de compte ? S'inscrire</a></div>
</div>

<script>
  const API = "http://localhost:8080/ia";

  async function login() {
      const mail = document.getElementById("mail").value.trim();
      const password = document.getElementById("password").value.trim();

      try {
          // Utilisation de l'URL /user/login définie dans votre UserRestController
          const response = await fetch(`${API}/user/login`, {
              method: "POST",
              headers: {"Content-Type":"application/json"},
              body: JSON.stringify({ mail, password })
          });

          if(!response.ok) throw new Error("Identifiants incorrects (vérifiez la DB)");

          // Votre backend renvoie le token en texte brut, pas en JSON
          const token = await response.text();
          localStorage.setItem("token", token);

          window.location = "ai.html";
      } catch(err) {
          alert(err.message);
      }
  }
</script>
</body>
</html>
