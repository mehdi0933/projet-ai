<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Mon Historique</title>
  <style>
    body { margin:0; font-family: 'Segoe UI', sans-serif; background:#f0f2f5; padding:40px; }
    .container { max-width:900px; margin:auto; background:white; padding:30px; border-radius:12px; box-shadow:0 4px 15px rgba(0,0,0,0.1); }
    .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 2px solid #f0f2f5; padding-bottom: 10px; }
    .user-badge { background: #e7f3ff; color: #007bff; padding: 5px 15px; border-radius: 20px; font-size: 14px; font-weight: bold; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    th { background: #007bff; color: white; padding: 12px; text-align: left; }
    td { padding: 12px; border-bottom: 1px solid #ddd; font-size: 14px; }
    tr:hover { background: #f9f9f9; }
    .btn-main { background:#007bff; color:white; width: 100%; padding:12px; border:none; border-radius:8px; cursor:pointer; font-weight:bold; margin-top:20px; }
    .btn-back { background:#6c757d; color:white; width: 100%; padding:12px; border:none; border-radius:8px; cursor:pointer; font-weight:bold; margin-top:10px; }
  </style>
</head>
<body>
<div class="container">
  <div class="header">
    <h2>Historique des requêtes</h2>
    <div id="emailDisplay" class="user-badge">Chargement...</div>
  </div>

  <table id="historyTable">
    <thead>
    <tr>
      <th>Modèle</th>
      <th>Question</th>
      <th>Date</th>
    </tr>
    </thead>
    <tbody id="tableBody">
    </tbody>
  </table>

  <p id="noData" style="display:none; text-align:center; color: #666;">Aucun historique trouvé.</p>

  <button class="btn-main" onclick="loadHistory()">Rafraîchir</button>
  <button class="btn-back" onclick="location.href='ai.html'">Retour au Chat</button>
</div>

<script>
  const API = "http://localhost:8080/ia";

  function getMailFromToken() {
      const token = localStorage.getItem("token");
      if (!token) return null;
      try {
          const payload = JSON.parse(atob(token.split('.')[1]));
          return payload.sub || payload.mail || payload.username;
      } catch (e) { return null; }
  }

  async function loadHistory() {
      const mail = getMailFromToken();
      const token = localStorage.getItem("token");
      const tableBody = document.getElementById("tableBody");
      const noData = document.getElementById("noData");

      if (!mail || !token) {
          window.location = "connexion.html";
          return;
      }

      document.getElementById("emailDisplay").innerText = "Compte : " + mail;

      try {
          const response = await fetch(`${API}/ai/id/${encodeURIComponent(mail)}`, {
              method: "GET",
              headers: { "Authorization": "Bearer " + token }
          });

          if (!response.ok) throw new Error("Erreur serveur");

          const data = await response.json();

          if (!data || data.length === 0) {
              noData.style.display = "block";
              tableBody.innerHTML = "";
          } else {
              noData.style.display = "none";
              tableBody.innerHTML = data.map(item => `
                  <tr>
                      <td><strong>${item.model || 'AI'}</strong></td>
                      <td>${item.promptMsg || item.prompt_msg}</td>
                      <td>${new Date(item.searchDateTime || Date.now()).toLocaleString()}</td>
                  </tr>
              `).join('');
          }
      } catch (err) {
          console.error(err);
          noData.innerText = "Erreur de chargement : " + err.message;
          noData.style.display = "block";
      }
  }

  window.onload = loadHistory;
</script>
</body>
</html>
