<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>JirAWS</title>
    <style>
        body { font-family: Arial; text-align: center; padding: 20px; }
        h1 { color: red; }
        input, select, button { margin: 10px 0; padding: 8px; font-size: 16px; }
        #text { margin-top: 20px; font-weight: bold; }
    </style>
</head>
<body>

<h1>JirAWS</h1>

<input type="email" id="mailInput" placeholder="Entrez votre email">
<button id="fetchBtn">Chercher</button>

<div id="resultDiv"></div>

<script>

    const mailInput = document.getElementById("mailInput");
    const fetchBtn = document.getElementById("fetchBtn");
    const resultDiv = document.getElementById("resultDiv");


fetchBtn.addEventListener("click", async () => {
    const mail = mailInput.value.trim();
    if (!mail) return alert("Merci de saisir un email.");

    try {
        const response = await fetch(`http://localhost:8080/ai/id/${encodeURIComponent(mail)}`);
        if (!response.ok) throw new Error(`Erreur HTTP : ${response.status}`);

        const raw = await response.text();
        console.log("Données récupérées :", raw);

        const data = {};
        (raw.match(/(\w+)=([^,)\n]+)/g) || []).forEach(pair => {
            const [key, value] = pair.split("=");
            data[key.trim()] = value.trim();
        });

        console.log("Objet parsé :", data);

        resultDiv.innerHTML = `
            <div style="border:1px solid #ccc; padding:15px; max-width:600px; margin:10px auto; text-align:left;">
                <h2>Utilisateur : ${data.user || 'N/A'}</h2>
                <p><strong>Prompt :</strong> ${data.promptMsg || 'N/A'}</p>
                <p><strong>IA :</strong> ${data.model || 'N/A'}</p>
                <p><strong>Type de réponse :</strong> ${data.responseType || 'N/A'}</p>
                <p><strong>Durée :</strong> ${data.durationMs || 'N/A'} ms</p>
                <p><strong>Date :</strong> ${data.searchDateTime || 'N/A'}</p>
                <p><strong>URL API :</strong> <a href="${data.url || '#'}" target="_blank">${data.url || 'N/A'}</a></p>
                <p><strong>API Key :</strong> ${data.apiKey || 'N/A'}</p>
            </div>
        `;
    } catch (err) {
        console.error(err);
        resultDiv.textContent = "Impossible de récupérer les données.";
    }
});


</script>

</body>
</html>
